name: test
run-name: FEATURE - Building and Pushing Docker Image
on: workflow_dispatch
env:
  IMAGE_TAG: ${{ github.sha }}
  TRANSIT_511_API_KEY: ${{ secrets.TRANSIT_511_API_KEY }}

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: publish
        uses: 0x4r45h/docker-compose-ci@v0.1.0

  deploy-new-image:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - run: echo "SSH into Droplet"
      - name: Login to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
      - name: Run docker compose
        uses: hoverkraft-tech/compose-action@d2bee4f07e8ca410d6b196d00f90c12e7d48c33a # v2.6.0
        with:
          compose-file: "./docker-compose.yml"
          up-flag: "--detach --no-build --pull"
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          TRANSIT_511_API_KEY: ${{ env.TRANSIT_511_API_KEY }}