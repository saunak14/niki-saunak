name: feature
run-name: FEATURE - Building and Pushing Docker Image
on: workflow_dispatch

env:
  IMAGE_TAG: ${{ github.sha }}
  TRANSIT_511_API_KEY: ${{ secrets.TRANSIT_511_API_KEY }}

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout Repo
        uses: actions/checkout@v4.2.2
      - name: Build and Push Docker Images
        uses: 0x4r45h/docker-compose-ci@v0.1.0

  deploy-new-image:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Login to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export TRANSIT_511_API_KEY=${{ env.TRANSIT_511_API_KEY }}
            docker ps -aq | xargs docker rm -f
            cd /home/nikita/niki-saunak && git checkout ${{ github.ref_name }} && git pull origin ${{ github.ref_name }}
            docker compose up -d --no-build
            unset IMAGE_TAG && unset TRANSIT_511_API_KEY