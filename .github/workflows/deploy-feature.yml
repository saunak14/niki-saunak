name: feature
run-name: FEATURE - Building and Pushing Docker Image
on: workflow_dispatch

env:
  IMAGE_TAG: ${{ github.sha }}
  TRANSIT_511_API_KEY: ${{ secrets.TRANSIT_511_API_KEY }}

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
      - name: Build and push docker images
        uses: 0x4r45h/docker-compose-ci@v0.1.0

  deploy-new-image:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: humbertocrispim/ssh-docker-compose-action@v1.0.0
        name: Remote Deployment with Docker-Compose
        with:
          ssh_host: ${{ secrets.HOST }}
          ssh_private_key: ${{ secrets.SSH_KEY }}
          ssh_user: ${{ secrets.SSH_USERNAME }}
          docker_compose_prefix: nikisaunak
          docker_compose_filename: ./docker-compose.yml
          pull: true # Update images when pulling   
