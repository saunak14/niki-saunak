name: feature
run-name: FEATURE - Building and Pushing Docker Image
on: workflow_dispatch

env:
  IMAGE_TAG: ${{ github.sha }}
  TRANSIT_511_API_KEY: ${{ secrets.TRANSIT_511_API_KEY }}

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
      - name: Build and push docker images
        uses: 0x4r45h/docker-compose-ci@v0.1.0

  deploy-new-image:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - run: echo "SSH into Droplet"
      - name: Login to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            docker pull nikitasreenath/nikisaunak-frontend:${{ github.sha }}
            docker pull nikitasreenath/nikisaunak-backend:${{ github.sha }}
            docker image list
            docker ps -aq | xargs docker rm -f
            docker run -d --restart unless-stopped --name nikisaunak-frontend -p 8080:80 nikitasreenath/nikisaunak-frontend:${{ github.sha }}
            docker run -d --restart unless-stopped --name nikisaunak-backend -p 8000:8000 nikitasreenath/nikisaunak-backend:${{ github.sha }}
